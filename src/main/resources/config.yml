# Roguelike 全局配置

storage:
  # 可选: json 或 sqlite
  type: json
  # SQLite 文件路径，相对于 plugins/minerogue 目录
  sqlite-file: roguelike.db
  # 定期保存间隔 (ticks)，20 ticks = 1 秒。最低 600 ticks。
  save-interval: 1200
  # 开启后定期保存会在异步线程写入磁盘，降低主线程 IO 抖动。
  async-save: true
  backup:
    # 自动备份玩家数据到 plugins/minerogue/backups/player-data-*.zip
    enabled: true
    # 备份间隔（分钟），最低 10 分钟。
    interval-minutes: 60
    # 保留最近多少份备份。
    keep: 24

debug:
  # 开启后会在控制台输出更多开发调试日志，包括玩家破坏方块、吃东西、升级、击杀和用券
  enabled: false
  # 内存中保留的最近调试记录数量。
  memory-records: 1000
  # 文件写入设置；文件位于插件数据目录下的 debug/。
  file:
    enabled: false
    directory: debug
    max-bytes: 1048576
    keep-files: 5
  # 异步写入刷新间隔（ticks）。
  flush-interval-ticks: 20
  # 记录采样率，范围 0.0-1.0。
  sample-rate: 1.0
  # 仅记录不低于此耗时（毫秒）的 trace/event；0 表示不限制。
  min-duration-ms: 0.0
  # 不记录的事件名列表（不区分大小写）；显式 [] 表示不排除任何事件。
  exclude-events: [player_move]

content:
  github-sync:
    # 开启后启动或 /rw reload 时会从 GitHub/raw 地址拉取内容 YAML 到 plugins/minerogue/content/。
    # 默认打开；base-url 为空时不会发起网络请求，适合仅使用本地 content 目录。
    enabled: true
    # 是否从 GitHub 下载铸造配方。关闭后保留并使用本地 content/recipes/forge-recipes.yml。
    download-recipes: true
    # 示例: https://raw.githubusercontent.com/TecoStudio/minerogue-content/main/content
    base-url: ""
    # 需要拉取的相对路径。路径会写入 plugins/minerogue/content/<相对路径>。
    files:

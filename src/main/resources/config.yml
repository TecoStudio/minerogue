    overwrite-existing: true

gameplay:
  # 怪物击杀经验倍率。0 = 关闭击杀经验，2.0 = 双倍经验。
  exp-multiplier: 1.0
  # 挖矿/进食里程碑经验倍率。未配置时建议与击杀经验分开调节。
  progression-exp-multiplier: 1.0
  # 所有随机武器掉落概率倍率。默认 0 = 怪物不掉落插件随机武器；改为 1.0 后使用下方基础概率。
  weapon-drop-multiplier: 0.0
  # 随机武器基础掉落概率，最终概率 = 此处概率 * weapon-drop-multiplier。
  weapon-drop-chances:
    legendary: 0.002
    epic: 0.005
    rare: 0.010
    common: 0.020

integrations:
  placeholderapi:
    enabled: false
  tab:
    # 启用后建议关闭内置 scoreboard，并在 TAB 中使用 PlaceholderAPI 占位符
    enabled: false
  commandapi:
    # 当前为兼容检测；未安装时自动回退到 Bukkit 命令
    enabled: false
  mythicmobs:
    # 启用后使用 MythicMobs 怪物系统；本插件内置怪物不会自然生成
    enabled: false
  nova:
    # 启用后武器 item 可填写 nova:<namespace>:<id>
    enabled: false

scoreboard:
  # 是否启用内置侧边栏与 Tab 列表；默认开启，不需要外部展示插件即可使用
  enabled: true
  # 更新间隔 (ticks)
  update-interval: 20

boss-damage-scoreboard:
  # 是否启用 Boss 伤害实时侧边栏（战斗中显示伤害排行，死亡后恢复普通侧边栏）
  enabled: true
  # 侧边栏刷新间隔 (ticks)
  update-interval-ticks: 10
  # 侧边栏最多显示的名次
  top-display: 10

resource-pack:
  # 进服时自动向玩家下发资源包。url 留空则关闭下发（玩家需手动安装）。
  # 默认指向 minerogue-resourcepack 的每夜构建（nightly release，始终只有最新一份）。
  url: "https://github.com/LIPiston/minerogue-resourcepack/releases/download/nightly/minerogue-resourcepack.zip"
  # 资源包 zip 的 SHA1（小写十六进制 40 位）。客户端据此缓存：hash 不变则不重新下载。
  # 留空（默认）时插件自动从 url + .sha1 异步拉取（nightly release 已配套发布 .sha1），无需手动维护。
  # 填入固定值则跳过网络拉取直接使用该值（自托管/离线场景兜底）。
  hash: ""
  # true = 强制加载，拒绝的玩家会被踢出；false = 玩家可拒绝。
  forced: false
  # 下发时显示的提示语（留空用客户端默认）。
  prompt: "§aRoguelike §f推荐安装资源包以显示自定义武器材质。"
  # 玩家拒绝或下载失败时（非强制）发送的提示。
  declined-message: "§7未安装资源包：部分自定义武器将显示为原版材质。"

      - weapons/rusty_iron_sword.yml
      - weapons/special_weapon.yml
      - weapons/squall_fan_bow.yml
      - weapons/storm_spear.yml
      - weapons/stormcoil_blade.yml
      - weapons/thunder_axe.yml
      - weapons/tempest_maul.yml
      - weapons/tidebreaker_trident.yml
      - weapons/venomwake_glaive.yml
      - weapons/vampire_dagger.yml
